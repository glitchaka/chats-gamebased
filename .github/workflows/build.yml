name: Build Windows chat

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - 'build.cmd'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package portable distribution
        shell: pwsh
        run: |
          Remove-Item "dist/chats-gamebased" -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build --config Release --prefix "dist/chats-gamebased"
          if (-not (Test-Path "dist/chats-gamebased/chats-gamebased.exe")) {
            throw "portable executable was not produced"
          }

      - name: Upload portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: chats-gamebased-windows-x64
          path: dist/chats-gamebased/**
          if-no-files-found: error
